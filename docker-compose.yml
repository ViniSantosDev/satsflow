version: '3.8'

services:
  # ================= PostgreSQL =================
  postgres:
    image: postgres:15-alpine
    container_name: satsflow-postgres
    environment:
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: myapp_password
      POSTGRES_DB: myapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - satsflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d satsflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================= Redis =================
  redis:
    image: redis:7-alpine
    container_name: satsflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - satsflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================= Satsflow Application =================
  satsflow:
    build: .
    container_name: satsflow-app
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/satsflow
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - satsflow-network
    restart: unless-stopped

# ================= Volumes =================
volumes:
  postgres_data:
  redis_data:

# ================= Networks =================
networks:
  satsflow-network:
    driver: bridge

