spring:
  config:
    activate:
      on-profile: prod

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/satsflow}
    username: ${SPRING_R2DBC_USERNAME:satsflow}
    password: ${SPRING_R2DBC_PASSWORD:satsflow}
    pool:
      max-idle-time: 60m
      initial-size: 10
      max-size: 30
      max-acquire-time: 3000
      validation-query: SELECT 1

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 3000

  sql:
    init:
      mode: always
      platform: postgresql

logging:
  level:
    root: INFO
    br.com.vinisantosdev.satsflow: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/satsflow/application.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  error:
    include-message: always

# Segurança em produção
app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-in-production}
    expiration: ${APP_JWT_EXPIRATION:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        liveness:
          enabled: true
        readiness:
          enabled: true

