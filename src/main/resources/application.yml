spring:
  config:
    activate:
      on-profile: dev

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/myapp_db
    username: myapp_user
    password: myapp_password
    pool:
      max-idle-time: 30m
      initial-size: 5
      max-size: 10

  flyway:
    url: jdbc:postgresql://localhost:5432/myapp_db
    user: myapp_user
    password: myapp_password
    locations: classpath:db/migration

  redis:
    host: localhost
    port: 6379

  sql:
    init:
      mode: never  # Flyway cuida do schema

logging:
  level:
    root: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  jwt:
    secret: dev-secret-key-not-for-production
    expiration: 604800